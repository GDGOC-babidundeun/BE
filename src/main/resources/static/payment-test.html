<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 테스트</title>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding: 80px 40px; }
    .container { width: 100%; max-width: 400px; text-align: center; }
    h2 { margin-bottom: 8px; }
    p { color: #666; margin-bottom: 32px; }
    button {
      width: 100%; padding: 16px;
      background: #3182f6; color: white; border: none;
      border-radius: 8px; font-size: 16px; cursor: pointer;
    }
    button:hover { background: #1c6ef3; }
  </style>
</head>
<body>
<div class="container">
  <h2>바비오더 결제 테스트</h2>
  <p>결제 금액: 50,000원</p>
  <button id="pay-btn">카드 결제하기</button>
</div>

<script>
  const clientKey = "test_ck_BX7zk2yd8y2AYdZmBK1Q3x9POLqK";
  const tossPayments = TossPayments(clientKey);

  document.getElementById("pay-btn").addEventListener("click", function () {
    tossPayments.requestPayment("카드", {
      amount: 50000,
      orderId: Math.random().toString(36).slice(2),
      orderName: "바비오더 테스트 결제",
      customerName: "테스트 고객",
      successUrl: "http://localhost:8080/api/payments/success",
      failUrl: "http://localhost:8080/api/payments/fail",
    }).catch(function (error) {
      if (error.code !== "USER_CANCEL") {
        alert("오류: " + error.message);
      }
    });
  });
</script>
</body>
</html>
