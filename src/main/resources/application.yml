spring:
  application:
    name: babi-order

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:babi_order}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:babi}
    password: ${DB_PASSWORD:babi_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}
